      tag: 'Stav 1 · zvedám oblast', odds: ['61 %', 'g'], fin: ['−4', 'r'],

      blocs: [['Koalice 92', ''], ['Partner (Bander Abis) 12', 'n'], ['Opozice 96', 'b']],
      who: ['Poradkyně pro rozpočet', 'reaguje na posuvník Školství'], ctx: 'Školství +2 → +3',
      quote: 'Další krok nahoru už je hodně za bezpečným pásmem. Učitelé zatleskají, ale Brusel a ministr financí se začnou ptát, kde vezmeš peníze.',
      exp: [['Hned', '<span class="ch g">Podpora +1</span><span class="ch b">Finance −1</span>'], ['Během roku', 'univerzitní kraje <span class="ch g">+1</span><br><span class="ch g">Aktivisté ▼1</span>'], ['Riziko', '<span class="ch b">EU ▲2</span> 4 poslanci partnera váhají · šance −3 %']],
      delta: 'Teď +2 · po kroku +3 · bezpečné pásmo −1…+1',
      impact: { sub: 'rámeček = Školství', parts: { sup: 4, fin: -3, act: -3, eu: 2 }, hl: { sup: 1, fin: 1, act: 1, eu: 1, Praha: 1, 'Olomoucký': 1 } },
    },
    tabs: {
      tag: 'Stav 2 · oblasti v kolech', odds: ['64 %', 'g'], fin: ['−3', 'r'], tabs: true,
      on: 'Obrana', hover: 2, seats: { yes: 108, flipOut: 0, flipIn: 3 },
      blocs: [['Koalice 92', ''], ['Partner 12', 'n'], ['Opozice 96', 'b'], ['+3 z opozice', '']],
      who: ['Poradkyně pro rozpočet', 'reaguje na posuvník Obrana'], ctx: 'Obrana +1 → +2',
      quote: 'Spojenci chtějí víc na obranu a tohle jim udělá radost. Doma to moc lidí neocení a peníze budou chybět v kole Budoucnost.',
      exp: [['Hned', '<span class="ch g">Prestiž +2</span><span class="ch b">Finance −1</span>'], ['Během roku', 'Moravskoslezský <span class="ch g">+1</span><br><span class="ch b">Aktivisté ▲1</span>'], ['Kolo Budoucnost', 'balík se zmenší o 5 %, Věda a výzkum začne pod nulou']],
      delta: 'Teď +1 · po kroku +2 · v kole „Bezpečnost a stát“ zbývá 1 krok',
      impact: { sub: 'rámeček = Obrana', parts: { pre: 2, fin: -1, act: 1 }, hl: { pre: 1, fin: 1, act: 1, 'Moravskoslezský': 1 } }, map: true,
    },
    impact: {
      tag: 'Stav 3 · najetí na dopad', odds: ['64 %', 'g'], fin: ['−3', 'r'],
      src: ['Školství', 'Neziskovky', 'Životní prostř.'], seats: { yes: 108, flipOut: 0, flipIn: 0 },
      blocs: [['Koalice 92', ''], ['Partner 12', 'n'], ['Opozice 96', 'b']],
      who: ['Poradkyně pro rozpočet', 'vysvětluje řádek Aktivisté'], ctx: 'Aktivisté ▼4',
      quote: 'Aktivisté jsou klidnější hlavně kvůli Školství. Škrt v Životním prostředí jim to ale z půlky kazí. Když ho vrátíš na nulu, budou skoro spokojení.',
      exp: [['Odkud to je', 'Školství <span class="ch g">▼5</span><br>Životní prostř. <span class="ch b">▲2</span> · Neziskovky <span class="ch">0</span>'], ['Co to znamená', 'pod 30 naštvanosti nehrozí demonstrace ani petice'], ['Tip', 'Životní prostř. na 0 → <span class="ch g">Aktivisté ▼2</span> <span class="ch b">Finance −1</span>']],
      delta: 'Najeď na jiný řádek a uvidíš, které posuvníky ho mění',
      impact: { sub: 'najeto: Aktivisté', sel: 'act' },
    },
    cut: {
      tag: 'Stav 4 · škrt přes červenou linii', odds: ['41 %', 'r'], fin: ['+2', 'g'],
      on: 'Důchody', hover: -2, val: { 'Důchody': -2 }, seats: { yes: 96, flipOut: 12, flipIn: 0 },
      blocs: [['Koalice 92', ''], ['Partner 12 · proti', 'b on'], ['Opozice 96', 'b']],
      who: ['Poradkyně pro rozpočet', 'reaguje na posuvník Důchody'], ctx: 'Důchody −1 → −2',
      quote: 'Tohle partner nepodepíše, důchody jsou jeho červená linie. Dostaneš peníze do kasy, ale rozpočet nejspíš neprojde a venkov ti to spočítá.',
      redline: 'Červená linie: partner v koalici (Bander Abis) hlasuje proti, když jsou Důchody pod −1.',
      exp: [['Hned', '<span class="ch g">Finance +3</span><span class="ch b">Koalice −3</span>'], ['Během roku', '<span class="ch b">Důchodci ▲6</span><br>venkovské kraje <span class="ch b">−2</span>'], ['Hlasování', '12 hlasů partnera přejde proti · šance 64 % → 41 %']],
      delta: 'Teď −1 · po kroku −2 · bezpečné pásmo −1…+1',
      impact: { sub: 'rámeček = Důchody', total: { res: { fin: -1, sup: 2, coa: -4, pre: 2 }, grp: [['pen', 9], ['eu', -3], ['act', -4], ['oli', 1]], kraje: [['Vysočina', -3], ['Jihočeský', -2.5], ['Zlínský', -2], ['Moravskoslezský', 1.5], ['Ústecký', 1.5], ['Praha', 1]], more: 6 },
        parts: { fin: 3, sup: -2, coa: -3, pen: 6 }, hl: { fin: 1, sup: 1, coa: 1, pen: 1, 'Vysočina': 1, 'Jihočeský': 1, 'Zlínský': 1 } }, map: true, faces: true,
    },
    bloc: {
      tag: 'Stav 5 · najetí na sněmovnu', odds: ['52 %', 'y'], fin: ['−3', 'r'],
      src: ['Zemědělství', 'Doprava'], seats: { yes: 99, flipOut: 0, flipIn: 0, hover: [99, 113] },
      blocs: [['Koalice 92', ''], ['Partner 7', 'n'], ['Venkovští nezávislí 14 · váhají', 'n on'], ['Opozice 87', 'b']],
      who: ['Poradkyně pro rozpočet', 'vysvětluje blok ve sněmovně'], ctx: 'Venkovští nezávislí · 14',
      quote: 'Chybí ti dva hlasy. Venkovští nezávislí nesnesou škrt v Zemědělství. Stačí ho vrátit na −1, nebo přidat na Dopravu, a většinu máš.',
      exp: [['Co chtějí', 'Zemědělství ≥ −1<br>Doprava ≥ +1'], ['Když jim vyhovíš', '+9 hlasů · šance <span class="ch g">71 %</span>'], ['Co tě to stojí', '<span class="ch b">Finance −2</span> nebo <span class="ch b">Finance −1</span>']],
      delta: 'Zvýrazněné posuvníky vlevo rozhodují o tomhle bloku',
      impact: { sub: 'za celý rok' }, wiresSrc: true,
    },
  };

  const v = new URLSearchParams(location.search).get('v') ?? 'one';

  const C = (t, c = '') => `<span class="ch ${c}">${t}</span>`;
  const NUMS = `${C('šance −3 b.', 'b')}${C('Finance −1', 'b')}${C('Podpora +2', 'g')}`;
  const TT = {
    one: { tag: 'Varianta A · jedna věta', big: true, body: `
      <p class="calm-line"><b>Školství +20 % → +30 %</b> Za bezpečným pásmem: učitelé zatleskají, ale každý další krok stojí víc.</p>
      <p class="calm-nums">${NUMS}</p>` },
    check: { tag: 'Varianta B · stav bez řečí', big: true, body: `
      <p class="calm-line"><b>Školství +20 % → +30 %</b></p>
      <ul class="calm-check">
        <li class="b"><span>Bezpečné pásmo</span><b>mimo (−10…+10 %)</b></li>
        <li class="b"><span>Šance na schválení</span><b>64 % → 61 %</b></li>
        <li class="g"><span>Červené linie</span><b>v pořádku</b></li>
      </ul>` },
    strip: { tag: 'Varianta C · jeden řádek pod sněmovnou', strip: true },
    bubble: { tag: 'Varianta D · bublina u posuvníku', bubble: true },
    quote: { tag: 'Varianta E · jen poradce', big: true, body: `
      <div class="who"><div class="avatar"></div><div><b>Poradkyně</b><span>Školství +20 % → +30 %</span></div></div>
      <p class="quote">Za bezpečným pásmem. Učitelé zatleskají, Brusel a ministr financí se začnou ptát.</p>` },
  };


  const st = S.raise; st.tag = TT[v].tag;

  // ---------- header ----------
  document.getElementById('tag').textContent = st.tag;
  const kO = document.getElementById('kOdds'); kO.classList.add(st.odds[1]); kO.querySelector('b').textContent = st.odds[0];
  const kF = document.getElementById('kFin'); kF.classList.add(st.fin[1]); kF.querySelector('b').textContent = st.fin[0];

  // ---------- left ----------
  function hslider(v, o = {}) {
    const min = -3, max = 3, p = (x) => ((x - min) / (max - min)) * 100;
    let h = `<div class="hs__track"></div><div class="hs__band" style="left:${p(-1)}%;width:${p(1) - p(-1)}%"></div>`;
    for (let x = min; x <= max; x++) h += `<div class="hs__tick ${x === 0 ? 'z' : ''}" style="left:${p(x)}%"></div>`;
    h += `<div class="hs__fill" style="left:${Math.min(p(0), p(v))}%;width:${Math.abs(p(v) - p(0))}%;background:${v >= 0 ? 'var(--good)' : 'var(--bad)'}"></div>`;
    if (o.hover != null) h += `<div class="hs__ghost" style="left:${p(o.hover)}%"></div><div class="hs__hover" style="left:${p(o.hover)}%">${sgn(o.hover)}</div>`;
    return `<div class="hs">${h}<div class="hs__knob" style="left:${p(v)}%"></div></div>`;
  }
  let areas = AREAS.map(([n, val, prio]) => [n, (st.val && st.val[n]) ?? val, prio]);
  if (v === 'cut') areas = areas.map(([n, val, prio]) => [n, n === 'Důchody' ? -1 : val, prio]);
  if (st.tabs) areas = [['Obrana', 1], ['Policie', 0], ['Státní správa', -2], ['Doprava', 0], ['Hasiči a záchranáři', 0], ['Justice', 0]];
  let left = `<div class="ph"><span>Oblasti rozpočtu</span><span>krok = 1 % výdajů</span></div>`;
  if (st.tabs) left += `<div class="rtabs"><span>Sociální stát<i>✓</i></span><span class="on">Bezpečnost a stát<i>1</i></span><span>Budoucnost<i>4</i></span></div>`;
  left += areas.map(([n, val, prio]) => {
    const on = st.on === n; const src = st.src && st.src.includes(n);
    const cls = on ? 'on' : src ? 'src' : (st.on || st.src) ? 'dim' : '';
    const sub = on ? `<div class="sub"><span>loni 0 · teď ${sgn(val) || 0} · najeto ${sgn(st.hover)}</span><span style="color:${Math.abs(st.hover) > 1 ? '#ff8d80' : 'var(--good)'}">${Math.abs(st.hover) > 1 ? 'mimo pásmo' : 'v pásmu'}</span></div>` : '';
    return `<div class="sl ${cls}" data-n="${n}"><span class="star ${prio ? 'on' : ''}">${prio ? '★' : ''}</span><span>${n}</span>${hslider(val, on ? { hover: st.hover } : {})}<span class="val ${valCls(val)}">${sgn(val) || 0}</span>${sub}</div>`;
  }).join('');
  left += `<div class="leftfoot"><span>Klik na název = priorita</span><span>Volné prostředky <b style="color:var(--gold)">3 / 12</b></span></div>`;
  document.getElementById('left').innerHTML = left;

  // ---------- chamber ----------
  (() => {
    const rowsN = [14, 17, 20, 23, 25, 27, 29, 45 - 0]; const seats = [];
    const rowsUse = [16, 19, 22, 25, 27, 29, 30, 32];
    rowsUse.forEach((n, ri) => { const r = 58 + ri * 15; for (let i = 0; i < n; i++) { const a = Math.PI * (i / (n - 1)); seats.push([190 - r * Math.cos(a), 186 - r * Math.sin(a), a]); } });
    seats.sort((p, q) => p[2] - q[2]);
    const s = st.seats; let dots = '';
    seats.forEach(([x, y], i) => {
      let fill = i < s.yes ? '#6fc27f' : '#f0675c'; let stroke = '';
      if (s.flipOut && i >= s.yes && i < s.yes + s.flipOut) stroke = 'stroke="#efe6cf" stroke-width="2.5"';
      if (s.flipIn && i >= s.yes - s.flipIn && i < s.yes) stroke = 'stroke="#efe6cf" stroke-width="2.5"';
      if (s.hover && i >= s.hover[0] && i < s.hover[1]) { fill = '#d9b45a'; stroke = 'stroke="#efe6cf" stroke-width="2"'; }
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${fill}" ${stroke}/>`;
    });
    const no = 200 - s.yes; const pass = s.yes >= 101;
    document.getElementById('chamber').innerHTML = `<div class="ph"><span>Sněmovna · odhad</span><span>potřeba 101</span></div>
      <div class="chrow"><svg viewBox="0 0 380 192" width="150" height="76">${dots}<line x1="190" y1="58" x2="190" y2="190" stroke="#d9b45a" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
      <div class="count"><b style="color:${pass ? 'var(--good)' : 'var(--bad)'}">${s.yes}</b><small>pro · ${no} proti</small><br><span class="dl" style="color:${pass ? 'var(--good)' : 'var(--bad)'}">${pass ? 'projde' : 'neprojde'}</span>
      ${s.flipOut ? `<br><small style="color:#ff8d80">−${s.flipOut} přeběhne</small>` : ''}${s.flipIn ? `<br><small style="color:var(--good)">+${s.flipIn} přejde k tobě</small>` : ''}</div>
      <div class="blocs">${st.blocs.map(([t, c]) => `<span class="bloc ${c}">${t}</span>`).join('')}</div></div>`;
  })();

  // ---------- commentary: light variants (no recommendations) ----------
  const tt = TT[v];
  if (tt.big) document.body.classList.add('big');
  if (tt.strip || tt.bubble) document.body.classList.add('big', 'nocomment');
  if (tt.body) document.getElementById('comment').innerHTML = tt.body;
  if (tt.strip) document.getElementById('chamber').insertAdjacentHTML('beforeend', `<p class="calm-strip"><b>Školství +20 % → +30 %</b>Za bezpečným pásmem. ${NUMS}</p>`);
  if (tt.bubble) {
    requestAnimationFrame(() => {
      const row = document.querySelector('.sl.on').getBoundingClientRect();
      const base = document.getElementById('cols').getBoundingClientRect();
      document.getElementById('cols').insertAdjacentHTML('beforeend', `<div class="calm-bubble" style="left:${row.right - base.left + 12}px;top:${row.top - base.top - 4}px"><b>Školství +20 % → +30 %</b>Za bezpečným pásmem: každý další krok stojí víc.<br>${NUMS}</div>`);
    });
  }

  // ---------- right: impact ----------
  const W = 6;
  function bar(val, col, part) {
    const w = Math.min(Math.abs(val) * W, 50);
    let s = val === 0 ? '' : `<i style="${val > 0 ? 'left' : 'right'}:50%;width:${w}%;background:${col}"></i>`;
    if (part) { const pw = Math.min(Math.abs(part) * W, 50); s += `<i class="part" style="${part > 0 ? 'left' : 'right'}:50%;width:${pw}%"></i>`; }
    return `<div class="fx-bar">${s}</div>`;
  }
  const im = st.impact; const t = im.total || TOTAL; const hl = im.hl; const parts = im.parts || {};
  const rc = (k) => (im.sel ? (im.sel === k ? 'fx-row sel' : 'fx-row dim') : hl ? (hl[k] ? 'fx-row hl' : 'fx-row dim') : 'fx-row');
  const res = Object.entries(RES).map(([k, [n, c]]) => { const x = t.res[k] ?? 0;
    return `<div class="${rc(k)}" data-k="${k}"><span><span class="sq" style="background:${c}"></span>${n}</span>${bar(x, c, parts[k])}<span class="fx-num ${x > 0 ? 'g' : x < 0 ? 'b' : 'm'}">${x ? sgn(x) : '–'}</span></div>`; }).join('');
  const grp = t.grp.map(([k, x]) => { const [n, c] = GRP[k];
    return `<div class="${rc(k)}" data-k="${k}"><span><span class="sq" style="background:${c}"></span>${n}</span>${bar(-x, c, parts[k] && -parts[k])}<span class="fx-num ${x < 0 ? 'g' : 'b'}">${x < 0 ? '▼' : '▲'}${Math.abs(x)}</span></div>`; }).join('');
  const faces = st.faces ? `<div class="faces">${t.grp.map(([k, x]) => `<span style="border-color:${GRP[k][1]}"><i>${x > 4 ? '😠' : x > 0 ? '😒' : x < -2 ? '😊' : '🙂'}</i>${GRP[k][0]}</span>`).join('')}</div>` : '';
  const kr = t.kraje.map(([n, x]) => `<span class="fx-kraj ${x < 0 ? 'b' : ''} ${hl && hl[n] ? 'hl' : ''}" style="${(hl && !hl[n]) || im.sel ? 'opacity:.35' : ''}">${n} ${sgn(x)}</span>`).join('') + `<span class="fx-kraj more">+${t.more} další</span>`;
  let map = '';
  if (st.map) {
    const kv = Object.fromEntries(t.kraje);
    const TL = [['KV', 'Karlovarský', 0, 0], ['UL', 'Ústecký', 1, 0], ['LB', 'Liberecký', 2, 0], ['HK', 'Královéhradecký', 3, 0], ['MS', 'Moravskoslezský', 5, 0], ['PL', 'Plzeňský', 0, 1], ['ST', 'Středočeský', 1, 1], ['PHA', 'Praha', 2, 1], ['PA', 'Pardubický', 3, 1], ['OL', 'Olomoucký', 4, 1], ['JC', 'Jihočeský', 1, 2], ['VY', 'Vysočina', 2, 2], ['JM', 'Jihomoravský', 3, 2], ['ZL', 'Zlínský', 4, 2]];
    const heat = (x) => (x == null ? '#cfc6b0' : x >= 1.5 ? '#5fa36a' : x > 0 ? '#9fcf96' : x > -2 ? '#e6a99e' : '#d0675c');
    map = `<div class="hexmap">${TL.map(([ab, n, c, r]) => `<div class="hex" style="left:${c * 36 + 46}px;top:${r * 42 + (c % 2) * 21 + 4}px;background:${heat(kv[n])}">${ab}</div>`).join('')}</div>`;
  }
  const L = (ico, h, body) => `<div class="fx-lane"><div class="fx-lane__h"><span class="fx-ico">${ico}</span>${h}</div>${body}</div>`;
  const right = document.getElementById('right'); right.className = 'memo fx';
  right.innerHTML = `<div class="fx__title"><span>Dopad rozpočtu</span><small>${im.sub}</small></div>`
    + L('$', 'Zdroje', res) + L('☺', 'Skupiny · naštvanost', grp + faces) + L('⌖', 'Kraje', (st.map ? map : '') + kr)
    + `<div class="fx-foot"><span>Šance na schválení</span><b>${st.odds[0]}</b></div>`;

  // ---------- wires ----------
  function wire(svg, a, b, base) {
    const x0 = a.x - base.left, y0 = a.y - base.top, x1 = b.x - base.left, y1 = b.y - base.top, mx = (x0 + x1) / 2;
    return `<path d="M${x0} ${y0} C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}" stroke="#d9b45a" stroke-width="2" fill="none" stroke-dasharray="5 3"/><circle cx="${x1}" cy="${y1}" r="3.5" fill="#d9b45a"/><circle cx="${x0}" cy="${y0}" r="3.5" fill="#d9b45a"/>`;
  }
  function drawWires() {
    const svg = document.getElementById('wires'); const base = document.getElementById('cols').getBoundingClientRect();
    const mid = document.querySelector('.mid').getBoundingClientRect();
    let out = '';
    // route along the gap between the middle column and the impact card
    const gapX = mid.right + 7;
    const via = (a, b) => { const x0 = a.x - base.left, y0 = a.y - base.top, xg = gapX - base.left, x1 = b.x - base.left, y1 = b.y - base.top;
      return `<path d="M${x0} ${y0} L${xg - 10} ${y0} Q${xg} ${y0} ${xg} ${y0 + Math.sign(y1 - y0) * 10} L${xg} ${y1 - Math.sign(y1 - y0) * 10} Q${xg} ${y1} ${xg + 10} ${y1} L${x1} ${y1}" stroke="#d9b45a" stroke-width="2" fill="none" stroke-dasharray="5 3"/><circle cx="${x1}" cy="${y1}" r="3.5" fill="#d9b45a"/>`; };
    if (st.wires) {
      const on = document.querySelector('.sl.on').getBoundingClientRect();
      const targets = [...document.querySelectorAll('#right .fx-row.hl, #right .fx-kraj.hl')];
      // source: right edge of the active slider, run along the top edge of the middle column
      const sx = on.right, sy = on.top + on.height / 2;
      targets.forEach((el) => { const r = el.getBoundingClientRect(); out += via({ x: sx, y: sy }, { x: r.left, y: r.top + r.height / 2 }); });
      out += `<circle cx="${sx - base.left}" cy="${sy - base.top}" r="5" fill="#d9b45a"/>`;
    }
    if (st.wiresBack || st.wiresSrc) {
      const anchor = st.wiresBack ? document.querySelector('#right .fx-row.sel').getBoundingClientRect() : document.querySelector('.bloc.on').getBoundingClientRect();
      const ax = st.wiresBack ? anchor.left : anchor.left, ay = anchor.top + anchor.height / 2;
      document.querySelectorAll('.sl.src').forEach((el) => { const r = el.getBoundingClientRect();
        if (st.wiresBack) out += via({ x: r.right, y: r.top + r.height / 2 }, { x: ax, y: ay });
        else out += wire(svg, { x: r.right, y: r.top + r.height / 2 }, { x: ax, y: ay }, base); });
    }
    svg.innerHTML = out;
  }
  document.fonts.ready.then(() => requestAnimationFrame(drawWires));
</script>
